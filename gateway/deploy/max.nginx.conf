# Standalone vhost; never proxy the SSH-only management panel.
server {
    listen 80;
    server_name awg-max-191-44-45-36.sslip.io;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/awg-max-acme;
    }
    location / { return 404; }
}
server {
    listen 443 ssl;
    server_name awg-max-191-44-45-36.sslip.io;
    ssl_certificate /etc/letsencrypt/live/awg-max-191-44-45-36.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/awg-max-191-44-45-36.sslip.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log off;
    client_max_body_size 256k;
    location = /max/webhook {
        limit_except POST { deny all; }
        proxy_pass http://127.0.0.1:8081;
        proxy_read_timeout 25s;
        proxy_set_header X-Max-Bot-Api-Secret $http_x_max_bot_api_secret;
    }
    location / { return 404; }
}
