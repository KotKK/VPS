{% extends "base.html" %}{% block content %}
<h1>Выходные VPS</h1><section class="card"><h2>Добавить выходной VPS</h2><form method="post" action="/exits/new"><label>Название<input name="name" required maxlength="64"></label><label>IP-адрес<input name="address" required inputmode="decimal"></label><label>Логин<input value="root" readonly></label><label>Пароль<input name="password" type="password" autocomplete="new-password"></label><div class="actions"><button type="submit" name="action" value="create">Добавить VPS</button><button class="secondary" type="submit" name="action" value="cancel">Отмена</button></div></form></section><section class="card"><h2>Подключённые VPS</h2><ul>{% for node in exits %}<li><strong>{{ node.name }}</strong><span>{{ node.get('address', 'ожидание') }}</span></li>{% else %}<li class="muted">Выходные VPS пока не добавлены.</li>{% endfor %}</ul></section>
{% endblock %}
