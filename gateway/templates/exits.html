{% extends "base.html" %}{% block content %}
<h1>Exit VPS</h1><section class="card"><h2>Add exit VPS</h2><form method="post" action="/exits/new"><label>Name<input name="name" required maxlength="64"></label><label>IP address<input name="address" required inputmode="decimal"></label><label>Login<input value="root" readonly></label><label>Password<input name="password" type="password" autocomplete="new-password"></label><div class="actions"><button type="submit" name="action" value="create">Add VPS</button><button class="secondary" type="submit" name="action" value="cancel">Cancel</button></div></form></section><section class="card"><h2>Connected exits</h2><ul>{% for node in exits %}<li><strong>{{ node.name }}</strong><span>{{ node.get('address', 'pending') }}</span></li>{% else %}<li class="muted">No exit VPS configured.</li>{% endfor %}</ul></section>
{% endblock %}
