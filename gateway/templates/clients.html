{% extends "base.html" %}{% block content %}
<h1>Клиенты</h1><section class="card"><h2>Добавить клиента</h2><form method="post" action="/clients/new"><label>Название устройства<input name="name" required maxlength="64" autocomplete="off"></label><div class="actions"><button type="submit" name="action" value="create">Создать профиль</button><button class="secondary" type="submit" name="action" value="cancel">Отмена</button></div></form></section>
<section class="card"><h2>Созданные клиенты</h2><ul>{% for client in clients %}<li><strong>{{ client.name }}</strong><span class="client-actions"><a class="action-link" href="/clients/{{ client.name }}.conf">Файл</a><a class="action-link" href="/clients/{{ client.name }}/qr">QR-код</a><form class="inline-form" method="post" action="/clients/{{ client.name }}/delete" onsubmit="return confirm('Удалить клиента и отозвать его доступ?');"><button class="danger" type="submit">Удалить</button></form></span></li>{% else %}<li class="muted">Клиентов пока нет.</li>{% endfor %}</ul></section>
{% endblock %}
