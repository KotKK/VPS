[project]
name = "awg-gateway"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141,<1",
    "httpx>=0.28,<1",
    "paramiko>=4,<5",
    "jinja2>=3.1,<4",
    "pydantic>=2.13,<3",
    "python-multipart>=0.0.22,<1",
    "qrcode[pil]>=8.2,<9",
    "uvicorn>=0.53,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
